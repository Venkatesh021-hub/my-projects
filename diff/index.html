<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Upload Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎥 Video Upload Showcase</h1>
    <p>Upload and preview your videos instantly (demo version)</p>
  </header>

  <main>
    <div class="upload-section">
      <input type="file" id="videoInput" accept="video/*" multiple hidden />
      <button id="uploadBtn">Select Videos</button>
    </div>

    <div id="videoGallery" class="gallery"></div>
  </main>

  <footer>
    <p>Created by Kakarot | Demo project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
